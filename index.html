<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Random Viewer</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle at 50% 50%, #1b1ed6, #1c1f26 70%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centers content vertically */
            color: whitesmoke;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .home {
            padding: 15px 30px;
            background-color: black;
            color: whitesmoke;
            border: 2px solid #1b1ed6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .home:hover {
            background-color: #1b1ed6;
            transform: translateY(-3px);
        }

        .home:active {
            transform: translateY(1px);
        }

        .placeholder-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="home" onclick="location.href='videos.html'"><strong>Random Video</strong></button>
        <button class="home" onclick="location.href='picture.html'"><strong>Random Picture</strong></button>
    </div>

    <p class="placeholder-text">Click a button above to start!</p>

</body>
</html>
