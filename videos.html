<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Video Viewer</title>
    <style>
        
        body {
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle at 50% 50%, #1b1ed6, #1c1f26 70%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centers content vertically */
            color: whitesmoke;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .home {
            padding: 15px 30px;
            background-color: black;
            color: whitesmoke;
            border: 2px solid #1b1ed6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .home:hover {
            background-color: #1b1ed6;
            transform: translateY(-3px);
        }

        .home:active {
            transform: translateY(1px);
        }

        .media-content {
            width: 800px;
            height: 450px;
            max-width: 90%;
            border-radius: 12px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="home" id="btn-video"><strong>Random Video</strong></button>
        <button class="home" onclick="location.href='index.html'"><strong>Go Back</strong></button>
    </div>

    <iframe id="media-frame" class="media-content" src="" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

    <script>
        const videos = [
            'NWZQkwXtHJo', // WebDev Tutorial and
            'dQw4w9WgXcQ', // Rick Astley
            'kJQP7kiw5Fk', // Despacito
            'fJ9rUzIMcZQ', // Queen - Bohemian Rhapsody
            '3JZ_D3ELwOQ'  // Lofi Beats
        ];

        const frameElement = document.getElementById('media-frame');
        let lastVideoIndex = -1;

        function getUniqueRandomIndex(array, lastIndex) {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * array.length);
            } while (randomIndex === lastIndex && array.length > 1);
            return randomIndex;
        }

        function showRandomVideo() {
            const index = getUniqueRandomIndex(videos, lastVideoIndex);
            lastVideoIndex = index;
            frameElement.src = `https://www.youtube.com/embed/${videos[index]}?autoplay=1`;
        }

        showRandomVideo();

        document.getElementById('btn-video').addEventListener('click', showRandomVideo);
    </script>
</body>
</html>
