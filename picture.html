<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Picture Viewer</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle at 50% 50%, #1b1ed6, #1c1f26 70%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centers content vertically */
            color: whitesmoke;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .home {
            padding: 15px 30px;
            background-color: black;
            color: whitesmoke;
            border: 2px solid #1b1ed6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .home:hover {
            background-color: #1b1ed6;
            transform: translateY(-3px);
        }

        .home:active {
            transform: translateY(1px);
        }

        .media-content {
            width: 800px;
            height: 450px;
            max-width: 90%;
            border-radius: 12px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="home" id="btn-picture"><strong>Random Picture</strong></button>
        <button class="home" onclick="location.href='index.html'"><strong>Go Back</strong></button>
    </div>

    <img id="media-img" class="media-content" src="" alt="Random Display">

    <script>
        const pictures = [
            'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=1000&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1542831371-29b0f74f9713?w=1000&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=1000&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1618788372246-79faff0c3182?w=1000&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=1000&auto=format&fit=crop'
        ];

        const imgElement = document.getElementById('media-img');
        let lastPictureIndex = -1;

        function getUniqueRandomIndex(array, lastIndex) {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * array.length);
            } while (randomIndex === lastIndex && array.length > 1);
            return randomIndex;
        }

        function showRandomPicture() {
            const index = getUniqueRandomIndex(pictures, lastPictureIndex);
            lastPictureIndex = index;
            imgElement.src = pictures[index];
        }

        showRandomPicture();

        document.getElementById('btn-picture').addEventListener('click', showRandomPicture);
    </script>
</body>
</html>
