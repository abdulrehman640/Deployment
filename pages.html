<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Random Viewer</title>
    <style>
        /* --- CSS (The Look) --- */
        body {
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle at 50% 50%, #1b1ed6, #1c1f26 70%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column; /* Stack controls above media */
            align-items: center;
            justify-content: flex-start; /* Start from top */
            padding-top: 50px;
            color: whitesmoke;
        }

        /* Container for the buttons */
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 40px; /* Space between buttons and display */
        }

        /* Styling for BOTH buttons */
        .home {
            padding: 15px 30px;
            background-color: black;
            color: whitesmoke;
            border: 2px solid #1b1ed6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Hover effect (when mouse touches button) */
        .home:hover {
            background-color: #1b1ed6;
            transform: translateY(-3px); /* Lifts up slightly */
        }

        /* Active effect (when button is clicked) */
        .home:active {
            transform: translateY(1px); /* Pushes down slightly */
        }

        /* Container where the content (picture/video) appears */
        .display-area {
            width: 800px;
            height: 450px;
            max-width: 90%; /* Responsive for smaller screens */
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #fff;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden; /* Keeps sharp corners */
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        /* Styling the Image inside the area */
        .display-area img {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }

        /* Styling the iFrame inside the area */
        .display-area iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Initial message styling */
        .placeholder-text {
            color: #888;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- --- HTML (The Structure) --- -->
    
    <div class="controls">
        <!-- We use the original 'home' class you liked, but with specific IDs -->
        <button class="home" id="btn-video"><strong>Random Video</strong></button>
        <button class="home" id="btn-picture"><strong>Random Picture</strong></button>
    </div>

    <!-- This div is where JavaScript will place the random content -->
    <div class="display-area" id="main-display">
        <p class="placeholder-text">Click a button to start</p>
    </div>

    <!-- --- JAVASCRIPT (The Logic) --- -->
    <script>
        /* 1. DATA (Our infinite libraries) */

        // Array of YouTube Video IDs
        const videos = [
            'NWZQkwXtHJo', // WebDev Tutorial
            'dQw4w9WgXcQ', // Rick Astley
            'kJQP7kiw5Fk', // Despacito
            'fJ9rUzIMcZQ', // Queen - Bohemian Rhapsody
            '3JZ_D3ELwOQ'  // Lofi Beats
        ];

        // Array of Picture URLs (Using diverse examples)
        const pictures = [
            'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=1470', // Coding on Laptop
            'https://images.unsplash.com/photo-1542831371-29b0f74f9713?q=80&w=1470', // Cyberpunk City
            'https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?q=80&w=1470', // Matrix Code
            'https://images.unsplash.com/photo-1618788372246-79faff0c3182?q=80&w=1374', // Minimalist Abstract
            'https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=1470'  // Music Studio
        ];

        /* 2. CONFIGURATION */
        const display = document.getElementById('main-display');
        let lastVideoIndex = -1;
        let lastPictureIndex = -1;

        /* 3. Helper Function: Get a unique random index (prevents repeats) */
        function getUniqueRandomIndex(array, lastIndex) {
            let randomIndex;
            
            // Loop prevents picking the exact same item twice in a row
            do {
                randomIndex = Math.floor(Math.random() * array.length);
            } while (randomIndex === lastIndex && array.length > 1);

            return randomIndex;
        }

        /* 4. Function: Display Random Video */
        function showRandomVideo() {
            const index = getUniqueRandomIndex(videos, lastVideoIndex);
            lastVideoIndex = index;

            // Step A: Generate the new iframe HTML string
            const videoUrl = `https://www.youtube.com/embed/${videos[index]}?autoplay=1`;
            const videoHtml = `<iframe src="${videoUrl}" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;

            // Step B: Overwrite the display area with the new iframe
            display.innerHTML = videoHtml;
        }

        /* 5. Function: Display Random Picture */
        function showRandomPicture() {
            const index = getUniqueRandomIndex(pictures, lastPictureIndex);
            lastPictureIndex = index;

            // Step A: Generate the new img HTML string
            // I use pictures[index] which gets the actual URL from the array
            const pictureUrl = pictures[index];
            const imgHtml = `<img src="${pictureUrl}" alt="Random display">`;

            // Step B: Overwrite the display area with the new image
            display.innerHTML = imgHtml;
        }

        /* 6. EVENT LISTENERS (Connecting actions to buttons) */
        document.getElementById('btn-video').addEventListener('click', showRandomVideo);
        document.getElementById('btn-picture').addEventListener('click', showRandomPicture);
    </script>
</body>
</html>
